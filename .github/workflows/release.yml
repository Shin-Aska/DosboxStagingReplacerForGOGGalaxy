name: Build and Release C++ App

# Strategy: Only run on version tags to save private repo minutes
on:
  push:
    tags:
      - '*.*.*'
  # Allows you to trigger the build manually from the GitHub Actions tab
  workflow_dispatch:

# Grant the GITHUB_TOKEN permission to create releases and upload assets
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc-libs
            mingw-w64-x86_64-gcc>=16.0
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Verify Compiler Version
        shell: msys2 {0}
        run: |
          gcc --version
          g++ --version

      - name: Configure CMake
        shell: msys2 {0}
        run: cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build Code
        shell: msys2 {0}
        run: cmake --build build --config Release --target DosboxStagingReplacer

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/DosboxStagingReplacer.exe
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
